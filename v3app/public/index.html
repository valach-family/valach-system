<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VS — Valach System</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- A KERET ÜRES VÁZ: minden tartalmat a lap rajzol (app.js), egyetlen szövegforrásból
       (texts.mjs). Így a menücím, az oldalcím és a gomb-felirat nem tud elcsúszni (R81 §6). -->
  <div class="demobar" data-testid="demo-marker">
    <strong>Bemutató · mintaadatok</strong>
    <span class="muted">Nincs valódi levélküldés, számlázás vagy készletmozgás.</span>
    <span class="spacer"></span>
    <button type="button" class="plain" data-testid="demo-mail-open">Próbaüzenetek</button>
  </div>

  <header class="top" data-testid="header">
    <button type="button" class="mobile-toggle" data-testid="nav-toggle" aria-label="Menü megnyitása" aria-expanded="false">☰</button>
    <button type="button" class="brand" data-testid="brand" aria-label="Kezdőlap">VS</button>

    <details class="switcher" data-testid="account-switcher">
      <summary aria-label="Aktív fiók">
        <span class="label">Fiók</span>
        <span class="value" data-testid="header-workspace">nincs fiók</span>
        <span aria-hidden="true">⌄</span>
      </summary>
      <div class="menu" data-testid="ws-list"></div>
    </details>

    <span class="spacer"></span>
    <span class="sr-only" data-testid="header-acting-as">—</span>
    <span class="sr-only" data-testid="channel-proven">—</span>

    <details class="profile" data-testid="profile">
      <summary aria-label="Saját profil menü">
        <span class="avatar" data-testid="avatar">–</span>
        <span class="personname" data-testid="header-subject">nincs bejelentkezve</span>
        <span aria-hidden="true">⌄</span>
      </summary>
      <div class="menu" data-testid="profile-menu"></div>
    </details>
  </header>

  <!-- BELÉPÉSI OLDALAK: bejelentkezés után NINCS belépési űrlap a belső oldalon (UX-01). -->
  <section class="auth" data-testid="auth" hidden></section>

  <div class="layout" data-testid="app" hidden>
    <nav class="sidebar" data-testid="nav" aria-label="Főmenü"></nav>
    <div class="workspace">
      <div class="tabs" data-testid="tabs" aria-label="Nyitott munkalapok"></div>
      <main class="content" data-testid="main" tabindex="-1"></main>
    </div>
  </div>

  <dialog data-testid="panel"><div data-testid="panel-body"></div></dialog>
  <div class="toast" data-testid="toast" role="status" hidden></div>
  <noscript><p style="padding:24px">Ehhez a felülethez engedélyezd a JavaScriptet a böngészőben.</p></noscript>

  <script type="module" src="/app.js"></script>
</body>
</html>
